name: Feature request
description: Propose a scoped capability or workflow improvement.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    attributes:
      label: Workflow
      description: What are you trying to accomplish, and why is the current behavior insufficient?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
      description: Describe observable acceptance criteria, not only an implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives and constraints
      description: Include platform, focus-safety, privacy, compatibility, or performance constraints.
