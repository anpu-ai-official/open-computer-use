name: Bug report
description: Report a reproducible problem with setup, browser, native, DevTools, or preview behavior.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Review artifacts and logs for secrets before attaching them. Security vulnerabilities must use private reporting.
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and read the troubleshooting guide.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: dropdown
    attributes:
      label: Area
      options: [Installation, Browser automation, Native automation, DevTools diagnostics, iTerm2 preview, Uninstall or upgrade, Other]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Give the smallest prompt or command sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include Open Computer Use, macOS, Claude Code, Chrome, and iTerm2 versions.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Redacted doctor output
      description: Paste `open-computer-use doctor --deep` output after removing sensitive data.
      render: shell
