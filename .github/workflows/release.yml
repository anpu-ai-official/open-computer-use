name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (must match VERSION)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  darwin-arm64:
    name: Ad-hoc sign, test, and publish
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Validate release request
        run: |
          test "$(uname -m)" = arm64
          test "$(tr -d '[:space:]' < VERSION)" = "$RELEASE_VERSION"
          git rev-parse "v$RELEASE_VERSION" >/dev/null 2>&1 && { echo "Tag already exists" >&2; exit 1; } || true
      - name: Install source dependencies and test browser
        run: |
          make install-dev
          cd runtime
          npx playwright install chromium
          browser_path="$(node -p "require('playwright').chromium.executablePath()")"
          echo "CLAUDE_CUA_CHROME_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Validate source and run component tests
        run: make check && make test
      - name: Build ad-hoc-signed patched driver
        env:
          APPLE_CODESIGN_IDENTITY: '-'
          CUA_DRIVER_OUTPUT: ${{ runner.temp }}/OpenComputerUseDriver.app
          OCU_VERSION: ${{ inputs.version }}
        run: packaging/build-driver.sh
      - name: Verify ad-hoc signature
        run: |
          codesign --verify --deep --strict "$RUNNER_TEMP/OpenComputerUseDriver.app"
          codesign -dv --verbose=4 "$RUNNER_TEMP/OpenComputerUseDriver.app" 2>&1 | grep -q 'Signature=adhoc'
          if spctl --assess --type execute "$RUNNER_TEMP/OpenComputerUseDriver.app"; then
            echo "Expected the free release to require Gatekeeper approval" >&2
            exit 1
          fi
      - name: Build self-contained release
        env:
          OCU_VERSION: ${{ inputs.version }}
          CUA_DRIVER_APP_SOURCE: ${{ runner.temp }}/OpenComputerUseDriver.app
        run: packaging/build-release.sh
      - name: Test isolated installation
        run: |
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "dist/open-computer-use-$RELEASE_VERSION-darwin-arm64.tar.gz" -C "$RUNNER_TEMP/extracted"
          OCU_TEST_BUNDLE="$RUNNER_TEMP/extracted/open-computer-use-$RELEASE_VERSION" scripts/test-install.sh
      - name: Render and commit Homebrew formula
        env:
          OCU_VERSION: ${{ inputs.version }}
          OCU_REPOSITORY: ${{ github.repository }}
        run: |
          packaging/render-formula.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/open-computer-use.rb
          git commit -m "brew: update formula for $RELEASE_VERSION"
          git push origin HEAD:main
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=()
          if [ "${{ inputs.prerelease }}" = true ]; then prerelease_flag=(--prerelease); fi
          gh release create "v$RELEASE_VERSION" dist/* --target main --generate-notes \
            --notes "This is a free, ad-hoc-signed macOS release. It does not expire. If macOS blocks Open Computer Use Driver on first launch, open System Settings > Privacy & Security and choose Open Anyway, then rerun open-computer-use permissions." \
            "${prerelease_flag[@]}"
