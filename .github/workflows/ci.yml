name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install dependencies
        run: |
          make install-dev
          cd runtime
          npx playwright install chromium
          echo "CLAUDE_CUA_CHROME_PATH=$(node -e \"console.log(require('playwright').chromium.executablePath())\")" >> "$GITHUB_ENV"
      - name: Install ShellCheck
        run: brew install shellcheck
      - name: Static checks
        run: make check && shellcheck install.sh bin/* packaging/*.sh scripts/*.sh
      - name: Component tests
        run: make test
